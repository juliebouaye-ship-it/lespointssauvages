# Réveille le projet Supabase gratuit (réinitialise le délai d’inactivité).
# À configurer une fois : secrets GitHub SUPABASE_URL et SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions), valeurs = onglet API du dashboard Supabase.

name: Supabase keepalive

on:
  schedule:
    # Lundi et jeudi 08:00 UTC (~pas d’activité côté site suffit souvent à dépasser 7 jours)
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL et/ou SUPABASE_ANON_KEY manquants (voir README)."
            exit 1
          fi

      - name: Ping REST (lecture anonyme stand_orders)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          URL="${SUPABASE_URL%/}/rest/v1/stand_orders?select=id&limit=1"
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$URL")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Réponse inattendue (attendu 200). Corps:"
            cat /tmp/body || true
            exit 1
          fi
